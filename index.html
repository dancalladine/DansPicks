<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dan's Picks</title>
  <meta name="description" content="Dan's favourite independent shops: gifts, food & drink and clothing worth knowing about.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <h1 class="logo">Dan's Picks</h1>
      <p class="tagline">Independent shops I love, and where to buy.</p>
    </div>
  </header>

  <main class="wrap">
    <nav class="tabs" aria-label="Categories">
      <button class="tab" data-cat="all">All</button>
      <button class="tab" data-cat="gifts">Gifts</button>
      <button class="tab" data-cat="food-drink">Food &amp; Drink</button>
      <button class="tab" data-cat="clothing">Clothing</button>
    </nav>

    <section id="grid" class="grid" aria-live="polite"></section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>Links go straight to each shop. There are no affiliate links, tracking or cookies.</p>
    </div>
  </footer>

  <dialog id="detail" class="detail" aria-labelledby="detail-name">
    <button class="close" type="button" aria-label="Close">&times;</button>
    <div class="detail-media"></div>
    <div class="detail-body">
      <p class="detail-cat"></p>
      <h2 id="detail-name" class="detail-name"></h2>
      <p class="detail-blurb"></p>
      <p class="detail-price"></p>
      <a class="visit" target="_blank" rel="noopener">Visit shop <span aria-hidden="true">↗</span></a>
      <section class="similar">
        <h3>If you like this, you might also like…</h3>
        <div class="similar-row"></div>
      </section>
    </div>
  </dialog>

  <script src="data.js"></script>
  <script src="images/manifest.js"></script>
  <script src="script.js"></script>
</body>
</html>
